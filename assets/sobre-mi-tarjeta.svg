ico, doy charlas y comparto lo que aprendo</text><text x="24" y="260" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b949e">sobre DevOps, Kubernetes, Cloud e IA.</text><text x="24" y="292" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#3fb950">$ <tspan fill="#e6edf3">cat comunidad.txt</tspan></text><text x="24" y="314" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b949e">Speaker · Organizadora de comunidades tech · Aprendiendo en público</text><text x="24" y="346" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#3fb950">$ <tspan fill="#e6edf3">cat estado.txt</tspan></text><text x="24" y="368" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b949e">Construyendo, aprendiendo y compartiendo. Un commit a la vez.</text><text x="24" y="400" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="14" fill="#3fb950">$ </text><rect x="42" y="387" width="9" height="16" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></svg>